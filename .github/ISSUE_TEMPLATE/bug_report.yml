name: Bug report
description: The script failed, printed an error, or a value did not change / did not stay changed after signing out and back in.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Not a bug:** Win+G still opening the Game Bar (only capture is disabled, the app stays), no FPS gain after the run, or the values coming back after a major Windows update - all three are explained in the [FAQ](https://github.com/vadyaravadim/gamedvr-fso-disabler#faq).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: run-output
    attributes:
      label: Output of the run
      description: |
        Everything the elevated window printed, from the `GAMEDVR + FSO DISABLER vX.Y.Z` banner down, including any red ERROR line - the banner says which version you ran. If the window closed before you could copy it, run the script again from a console so the output stays - if every value is already at target, the run changes nothing:
        - PowerShell Gallery: `gamedvr-fso-disabler`
        - One-liner: `powershell -ExecutionPolicy Bypass -File "$env:USERPROFILE\gamedvr-fso-disabler.ps1"`
        - ZIP / clone, from the script's folder: `powershell -ExecutionPolicy Bypass -File .\gamedvr-fso-disabler.ps1`
      render: text
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: Value and what you see after signing back in
      description: The registry value the report is about, and what Settings > Gaming > Captures or Win+G shows.
      placeholder: GameDVR_FSEBehaviorMode - back to 0, fullscreen games still run borderless
  - type: dropdown
    id: launch-method
    attributes:
      label: How did you run it?
      description: Each method reaches the script through a different relaunch path, and that is where launch bugs live.
      options:
        - PowerShell Gallery (Install-Script)
        - irm | iex one-liner
        - Run.bat from the ZIP
        - .ps1 directly (clone or download)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display language
      description: Win+R, `winver`. The display language matters - error messages in the output are localized.
      placeholder: Windows 11 24H2, build 26100.4061, German
    validations:
      required: true
